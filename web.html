<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threads Store</title>



</head>
<body>

<header>

<h2>FASHION STORE</h2>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Products</a>
<a href="#">Categories</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h1>New Fashion Collection</h1>

<p>Discover the latest trends with premium quality cloths.</p>

<button>Shop Now</button>

</section>

<div class="search">

<input type="text" id="search" placeholder="Search Products..." onkeyup="searchProduct()">

</div>

<div class="categories">

<div class="cat">Shirts</div>
<div class="cat">Jeans</div>
<div class="cat">Shoes</div>
<div class="cat">Accessories</div>

</div>



</section>

<section class="contact">

<h2>Contact Us</h2>

<input type="text" placeholder="Your Name"><br>

<input type="email" placeholder="Email"><br>
<input type="address" placeholder="Address"><br>

<textarea rows="5" placeholder="Feedback"></textarea><br>

<button>Send</button>



<footer>

<h3>© 2026 FASHION Store | All Rights Reserved</h3>

</footer>

<script>

function cart(product){
alert(product + " Added to Cart");
}

function searchProduct(){

let input=document.getElementById("search").value.toUpperCase();

let cards=document.querySelectorAll(".card");

cards.forEach(card=>{

let title=card.querySelector("h3").innerText.toUpperCase();

if(title.indexOf(input)>-1)
card.style.display="";
else
card.style.display="none";

});

}

</script>

</body>
</html>
 <link rel="stylesheet" href="style.css">
